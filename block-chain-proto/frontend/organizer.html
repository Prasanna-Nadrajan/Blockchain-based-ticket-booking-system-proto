<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Organizer Dashboard - NFTTix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;}
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 0.5rem 1rem; cursor: pointer; font-size: 1rem; font-weight: 600;}
        .tab-btn.active { color: var(--primary-accent); border-bottom: 2px solid var(--primary-accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <span class="gradient-text">NFTTix</span> <span style="font-size: 0.875rem; color: #9ca3af; font-weight: 500;">| Organizer Dashboard</span>
        </a>
        <div class="wallet-badge" id="walletBadge">
            <div class="status-dot"></div> Not Connected
        </div>
    </nav>

    <div class="container" id="appRoot">
        <!-- Auth Guard gets injected here if disconnected -->
    </div>

    <template id="dashboardHtml">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('createEvent')">Create Event</button>
            <button class="tab-btn" onclick="switchTab('generateTickets')">Generate Tickets</button>
            <button class="tab-btn" onclick="switchTab('viewTickets')">View Tickets</button>
            <button class="tab-btn" onclick="switchTab('verifiers')">Gate Verifiers</button>
        </div>

        <!-- CREATE EVENT TAB -->
        <div id="createEvent" class="tab-content active">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2>Create New Event</h2>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Event metadata is stored off-chain in the API database.</p>
                <form id="createEventForm">
                    <div class="form-group">
                        <label>Event Name</label>
                        <input type="text" id="eventName" required placeholder="e.g. Neon Festival 2026">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Venue</label>
                        <input type="text" id="eventVenue" required placeholder="Virtual Arena">
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label>Total Capacity</label>
                            <input type="number" id="eventCapacity" required min="1" value="100">
                        </div>
                        <div>
                            <label>Ticket Price (ETH)</label>
                            <input type="number" id="eventPrice" required min="0" step="0.001" value="0.01">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%" id="createEventBtn">Create & Register Event (Requires Tx)</button>
                </form>
            </div>
        </div>

        <!-- GENERATE TICKETS TAB -->
        <div id="generateTickets" class="tab-content">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2>Mint Ticket NFTs</h2>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Mints ERC-721 tokens natively on the Hardhat blockchain.</p>
                <form id="generateTicketsForm">
                    <div class="form-group">
                        <label>Select Event</label>
                        <select id="generateEventSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Number of Tickets to Mint</label>
                        <input type="number" id="generateCount" required min="1" max="100" value="10">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%" id="mintBtn">Mint Tickets (Requires Tx)</button>
                </form>
            </div>
        </div>

        <!-- VIEW TICKETS TAB -->
        <div id="viewTickets" class="tab-content">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2>Event Tickets Ledger</h2>
                    <select id="viewEventSelect" style="width: 250px;"></select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Token ID</th>
                                <th>Owner Address</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTableBody">
                            <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Select an event to view tickets</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VERIFIERS TAB -->
        <div id="verifiers" class="tab-content">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2>Register Gate Verifier</h2>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Grant an address permission to mark tickets as used by calling markUsed().</p>
                <form id="addVerifierForm">
                    <div class="form-group">
                        <label>Verifier Wallet Address</label>
                        <input type="text" id="verifierAddr" required placeholder="0x...">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%">Add Verifier (Requires Tx)</button>
                </form>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initApp();
            const connected = await checkConnection();
            
            if (connected) {
                // Ensure they are actually an organizer by checking role
                try {
                    const res = await apiCall('/me/role');
                    if (!res.roles.includes("ORGANIZER")) {
                        document.getElementById('appRoot').innerHTML = `
                            <div class="card" style="text-align: center; padding: 4rem;">
                                <h2 style="color: var(--danger)">Access Denied</h2>
                                <p style="margin-top: 1rem">Your wallet (${window.userAddress}) is not registered as the contract Organizer.</p>
                                <p>Please switch to the deployer account in MetaMask.</p>
                            </div>
                        `;
                    } else {
                        renderDashboard();
                    }
                } catch (e) {
                    document.getElementById('appRoot').innerHTML = renderGuard();
                }
            } else {
                document.getElementById('appRoot').innerHTML = renderGuard();
            }
        });

        function renderDashboard() {
            document.getElementById('walletBadge').innerHTML = `<div class="status-dot connected"></div> ${window.userAddress.substring(0,6)}...${window.userAddress.substring(38)}`;
            document.getElementById('appRoot').innerHTML = document.getElementById('dashboardHtml').innerHTML;
            
            bindEvents();
            loadEventsForDropdowns();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function loadEventsForDropdowns() {
            try {
                const events = await apiCall('/events', { method: 'GET' });
                const selects = ['generateEventSelect', 'viewEventSelect'];
                selects.forEach(id => {
                    const el = document.getElementById(id);
                    if(!el) return;
                    el.innerHTML = '<option value="">-- Select Event --</option>';
                    events.forEach(ev => {
                        el.innerHTML += `<option value="${ev.id}">${ev.name} (${ev.date})</option>`;
                    });
                });
                
                document.getElementById('viewEventSelect').addEventListener('change', async (e) => {
                    if (e.target.value) loadTicketsTable(e.target.value);
                });
            } catch (e) {
                showToast("Error", "Could not load events", true);
            }
        }

        async function loadTicketsTable(eventId) {
            const tBody = document.getElementById('ticketsTableBody');
            tBody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Loading from blockchain index...</td></tr>';
            try {
                const tickets = await apiCall(`/events/${eventId}/tickets`, { method: 'GET' });
                if (tickets.length === 0) {
                    tBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No tickets minted yet</td></tr>';
                    return;
                }
                
                tBody.innerHTML = '';
                tickets.forEach(t => {
                    const badge = t.is_used ? '<span class="badge badge-used">USED</span>' : '<span class="badge badge-available">AVAILABLE</span>';
                    tBody.innerHTML += `
                        <tr>
                            <td>#${t.token_id}</td>
                            <td><span style="font-family: monospace">${t.owner}</span></td>
                            <td>${badge}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                tBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--danger);">Failed to load tickets</td></tr>';
            }
        }

        function bindEvents() {
            // Create Event API
            document.getElementById('createEventForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('createEventBtn');
                
                const data = {
                    name: document.getElementById('eventName').value,
                    date: document.getElementById('eventDate').value,
                    venue: document.getElementById('eventVenue').value,
                    capacity: parseInt(document.getElementById('eventCapacity').value),
                    price_eth: parseFloat(document.getElementById('eventPrice').value)
                };
                
                try {
                    btn.disabled = true;
                    btn.innerText = "Step 1: Saving Metadata...";
                    
                    // 1. Create on backend
                    const event = await apiCall('/events', { method: 'POST', body: data });
                    
                    // 2. Register on blockchain
                    btn.innerText = "Step 2: Confirm in MetaMask...";
                    const priceWei = ethers.parseEther(data.price_eth.toString());
                    const tx = await window.contract.setEventParams(event.id, priceWei, data.capacity);
                    
                    btn.innerText = "Mining Transaction...";
                    await tx.wait();
                    
                    showToast('Success', 'Event created and registered on-chain!');
                    e.target.reset();
                    loadEventsForDropdowns();
                } catch (err) {
                    console.error(err);
                    showToast('Error', err.message, true);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Create & Register Event (Requires Tx)";
                }
            });

            // Mint Tickets (Blockchain Tx)
            document.getElementById('generateTicketsForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const eventId = document.getElementById('generateEventSelect').value;
                const count = parseInt(document.getElementById('generateCount').value);
                const btn = document.getElementById('mintBtn');
                
                if (!eventId) return alert("Select an event");
                
                try {
                    btn.disabled = true;
                    btn.innerText = "Confirm in MetaMask...";
                    
                    // Call contract
                    const tx = await window.contract.mintBatch(eventId, count, window.userAddress);
                    
                    btn.innerText = "Mining Transaction...";
                    await tx.wait();
                    showToast('Success', `${count} tickets minted to your wallet!`);
                    e.target.reset();
                } catch (err) {
                    console.error(err);
                    showToast('Tx Failed', err.message || "Minting failed", true);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Mint Tickets (Requires Tx)";
                }
            });

            // Add Verifier (Blockchain Tx)
            document.getElementById('addVerifierForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const addr = document.getElementById('verifierAddr').value;
                const btn = e.target.querySelector('button');
                
                try {
                    btn.disabled = true;
                    btn.innerText = "Confirm in MetaMask...";
                    const tx = await window.contract.addVerifier(addr);
                    btn.innerText = "Mining...";
                    await tx.wait();
                    showToast('Success', `Verifier added: ${addr.substring(0,8)}...`);
                    e.target.reset();
                } catch (err) {
                    showToast('Tx Failed', err.message || "Failed to add verifier", true);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Add Verifier (Requires Tx)";
                }
            });
        }
    </script>
</body>
</html>
