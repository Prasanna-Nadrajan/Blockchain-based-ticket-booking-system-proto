<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Explore Events - NFTTix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .event-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .event-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-accent);
        }
        .price-badge {
            background: var(--surface-color);
            color: var(--primary-accent);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            display: inline-block;
            margin-top: 1rem;
        }
        .availability {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <span class="gradient-text">NFTTix</span> <span style="font-size: 0.875rem; color: #9ca3af; font-weight: 500;">| Marketplace</span>
        </a>
        <div class="wallet-badge" id="walletBadge">
            <div class="status-dot"></div> Not Connected
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Explore Events</h1>
                <p style="color: var(--text-muted);">Real-time ticket availability synced with the blockchain.</p>
            </div>
            <a href="holder.html" class="btn">View My Tickets</a>
        </div>

        <div id="appRoot">
            <div class="event-grid" id="eventGrid">
                <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 5rem;">Loading events from blockchain...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initApp();
            await checkConnection();
            
            if (window.userAddress) {
                document.getElementById('walletBadge').innerHTML = `<div class="status-dot connected"></div> ${window.userAddress.substring(0,6)}...${window.userAddress.substring(38)}`;
            }
            
            loadMarketplace();
        });

        async function loadMarketplace() {
            const grid = document.getElementById('eventGrid');
            try {
                const events = await fetch(`${BACKEND_URL}/marketplace`).then(r => r.json());
                
                grid.innerHTML = '';
                if (events.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 5rem; border: 1px dashed var(--border-color); border-radius: 12px;">
                            <h3 style="color: var(--text-muted)">No events active on-chain</h3>
                            <p style="margin-top: 1rem; font-size: 0.875rem;">Organizers must create and register events before they appear here.</p>
                        </div>
                    `;
                    return;
                }
                
                events.forEach(ev => {
                    const isSoldOut = ev.available <= 0;
                    grid.innerHTML += `
                        <div class="event-card animate">
                            <div style="font-size: 0.75rem; color: var(--primary-accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em">${ev.id}</div>
                            <h2 style="font-size: 1.5rem">${ev.name}</h2>
                            <p style="color: var(--text-muted); font-size: 0.9375rem">📍 ${ev.venue}</p>
                            <p style="color: var(--text-muted); font-size: 0.9375rem">📅 ${ev.date}</p>
                            
                            <div class="price-badge">${ev.price_eth} ETH</div>
                            <div class="availability">${ev.available} / ${ev.total} Tickets Left</div>
                            
                            <button class="btn btn-primary" 
                                style="margin-top: 1rem; width: 100%" 
                                onclick="buyTicket('${ev.id}', '${ev.price_eth}')"
                                ${isSoldOut ? 'disabled' : ''}>
                                ${isSoldOut ? 'SOLD OUT' : 'Buy Ticket'}
                            </button>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--danger);">Failed to load marketplace: ${err.message}</p>`;
            }
        }

        async function buyTicket(eventId, priceEth) {
            if (!window.userAddress) {
                await connectWallet();
                if (!window.userAddress) return;
            }

            try {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.disabled = true;
                btn.innerText = "Confirming Pay...";

                // Convert price to Wei for the transaction
                const priceWei = ethers.parseEther(priceEth.toString());
                
                // Call contract buy function
                const tx = await window.contract.buyTicket(eventId, { value: priceWei });
                
                btn.innerText = "Mining on Blockchain...";
                await tx.wait();
                
                showToast("Success!", "You purchased a ticket! Visit 'My Tickets' to see it.");
                loadMarketplace(); // Reload counts
            } catch (err) {
                console.error(err);
                showToast("Purchase Failed", err.reason || err.message, true);
            } finally {
                const btn = document.querySelector(`button[onclick*='${eventId}']`);
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Buy Ticket";
                }
            }
        }
    </script>
</body>
</html>
